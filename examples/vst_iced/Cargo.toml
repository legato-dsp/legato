[package]
name = "legato_grain_delay"
version = "0.1.0"
edition = "2024"
license = "AGPLv3"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
legato = { version = "0.4.0", path = "../../crates", features = ["simd"] }
nice-plug = { version = "0.4.2", features = [
    "assert_process_allocs",
    "standalone",
    "unsafe_standalone_dpi_fix",
] }
nice-plug-iced = { version = "0.5.0", features = ["canvas", "svg"] }
