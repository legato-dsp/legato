id = "legato"
name = "Legato"
version = "0.0.1"
schema_version = 1
authors = ["Luke <lukeweston1234@gmail.com>"]
description = "Syntax highlighting for the Legato DSL"
repository = "https://github.com/legato-dsp/legato"

# Zed fetches and builds the grammar from a git commit, not the working tree.
# `rev` MUST be a pushed commit containing the generated src/parser.c. For local
# development, swap `repository` for "file:///path/to/legato" and use a local commit.
[grammars.legato]
repository = "https://github.com/legato-dsp/legato"
path = "tree-sitter-legato"
rev = "896dd744dae3fcb61aff771327bb7c4ff402ae86"
